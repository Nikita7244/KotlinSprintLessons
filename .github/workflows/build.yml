# Сборка проекта на каждый pull request: код компилируется — проверка зелёная.
# Ревью задач делает платформа, этот workflow только показывает, что проект собирается.
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
